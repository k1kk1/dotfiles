# Herdr configuration
# dotfiles/herdr/config.toml -> ~/.config/herdr/config.toml

onboarding = false

# ==============================================================================
# Terminal
# ==============================================================================

[terminal]

# macOSではlogin shellとして起動し、現在のPaneのcwdを引き継ぐ。
shell_mode = "auto"
new_cwd = "follow"

# ==============================================================================
# Keybindings
# ==============================================================================

[keys]

prefix = "ctrl+b"

# 同じ番号でTab、Workspace、Agentを切り替える。
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# WorkspaceやTabをまたいで直前のPaneへ戻る。
last_pane = "prefix+backtick"

# ==============================================================================
# Popup tools
# ==============================================================================

[[keys.command]]

key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "90%"
height = "90%"

[[keys.command]]

key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

# ==============================================================================
# Git worktree
# ==============================================================================

[worktrees]

directory = "~/.herdr/worktrees"

# ==============================================================================
# UI
# ==============================================================================

[ui]

# 対応が必要なAgentを上に並べ、Pane境界にもAgent名を表示する。
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
sidebar_width = 30
copy_on_select = true

[ui.sidebar.agents]

rows = [
  ["state_icon", "agent", "state_text"],
  ["terminal_title_stripped"],
  ["pane", "tab"],
]

# ==============================================================================
# Notifications
# ==============================================================================

[ui.toast]

# Ghosttyへデスクトップ通知を依頼する。
delivery = "terminal"
delay_seconds = 2

[ui.sound]

enabled = false

# ==============================================================================
# Session
# ==============================================================================

[session]

resume_agents_on_restore = true

# ==============================================================================
# Japanese IME
# ==============================================================================

[experimental]

# Claude/Codex TUIでmacOSの日本語IME候補位置を追従させる。
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]

# Google日本語入力で英数入力から戻らない場合があるため有効化しない。
# switch_ascii_input_source_in_prefix = true
