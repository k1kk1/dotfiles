# Herdr configuration
# dotfiles/herdr/config.toml -> ~/.config/herdr/config.toml

onboarding = false

# ==============================================================================
# Terminal
# ==============================================================================

[terminal]

# macOSではlogin shellとして起動し、現在のPaneのcwdを引き継ぐ。
shell_mode = "auto"
new_cwd = "follow"

# ==============================================================================
# Keybindings
# ==============================================================================

[keys]

prefix = "ctrl+b"

# 標準の新規 Tab (`prefix+c`) は番号だけの Tab を作るため無効化し、下の
# Pane Manager コマンドへ置き換える。現在の作業ディレクトリ名を Tab 名にする。
new_tab = ""

# 同じ番号でTab、Workspace、Agentを切り替える。
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

# WorkspaceやTabをまたいで直前のPaneへ戻る。
last_pane = "prefix+backtick"

# ==============================================================================
# Popup tools
# ==============================================================================

[[keys.command]]

key = "prefix+c"
type = "shell"
command = "exec \"$HOME/src/herdr-plugins/herdr-pane-manager/target/release/herdr-pane-manager\" new-tab"
description = "現在の作業ディレクトリ名で新しい Tab を作る"

[[keys.command]]

key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "90%"
height = "90%"

[[keys.command]]

key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

# ==============================================================================
# Plugins
# ==============================================================================
#
# ~/src/herdr-plugins の6プラグイン。Herdrにはplugin actionへ直接キーを割り当てる
# 仕組みがないため、各プラグインのバイナリをpopupで起動する。
#
# descriptionはHerdr自身のキー一覧画面(prefix+?)に出るので、
# 自分向けのメモではなく表示用のラベルとして書くこと。
#
# キーの選び方: Herdrの既定が単文字をほぼ埋めている。
#   使用済み: ? c e g h j k l n o p q r s v w x z - tab 数字
#   空き:     u y space (+ shift+s / shift+l)  ... a d i はここで使用
# macOSではOptionが押しにくいので、空きから語呂の合うものを充てている。
# 既定を確認する: herdr --default-config | grep 'prefix+'
#
#   herdr plugin link ~/src/herdr-plugins/herdr-pane-manager   (他3つも同様)
#
# 右クリックメニューとCommand Paletteからは、この設定なしでも呼び出せる。

[[keys.command]]

# Paneを別Tabへ移籍・交換・切り出し・統合する。プロセスは止まらない。
key = "prefix+m"
type = "popup"
command = "exec \"$HOME/src/herdr-plugins/herdr-pane-manager/target/release/herdr-pane-manager\" ui manager"
description = "Pane を別 Tab へ移動・交換・集約"
width = "60%"
height = "70%"

[[keys.command]]

# 同一Tab内のレイアウト調整。Equalize / Grid / Main Left など。
key = "prefix+shift+l"
type = "popup"
command = "exec \"$HOME/src/herdr-plugins/herdr-layout-tools/target/release/herdr-layout-tools\" ui"
description = "Tab 内のレイアウトを整える"
width = "50%"
height = "60%"

[[keys.command]]

# 全WorkspaceのPane / Agent / Tabを横断検索してジャンプ。TabキーでScope切替。
key = "prefix+f"
type = "popup"
command = "exec \"$HOME/src/herdr-plugins/herdr-navigator/target/release/herdr-navigator\" ui panes"
description = "Pane / Agent / Tab を検索して移動"
width = "70%"
height = "70%"

[[keys.command]]

# 全プラグインのActionを横断検索して実行。
key = "prefix+space"
type = "popup"
command = "exec \"$HOME/src/herdr-plugins/herdr-command-palette/target/release/herdr-command-palette\" ui"
description = "全プラグインの Action を検索"
width = "70%"
height = "70%"

[[keys.command]]

# 起動中・停止中のHerdrセッションを一覧して、新しいウィンドウで開く。
# attach は今いるセッションの中では実行できない（nested herdr）ため、
# 外側のターミナルの新しいウィンドウが開く。
# Tabで Manage / Claude / Codex に切り替わる。
key = "prefix+shift+s"
type = "popup"
command = "exec \"$HOME/src/herdr-plugins/herdr-sessions/target/release/herdr-sessions\" ui open"
description = "Herdr セッション一覧・開く"
width = "70%"
height = "60%"

[[keys.command]]

# Claude Code / Codex の過去の会話を一覧して再開する。既定で全件・両方まとめて。
# こちらは外部プログラムを起動するだけなので、今のセッションの中で再開できる。
#   Enter        新しいWorkspace
#   Shift+Enter  新しいTab
#   Opt+Enter    今のPaneを分割
# TabでAll → Claude → Codexと絞り込む。Shift+TabでHerdrセッション一覧へ。
key = "prefix+a"
type = "popup"
command = "exec \"$HOME/src/herdr-plugins/herdr-sessions/target/release/herdr-sessions\" ui all"
description = "Claude Code / Codex の会話を再開"
width = "70%"
height = "60%"

[[keys.command]]

# 今の Pane の作業ディレクトリを、ターミナルの外へ渡す。
# Finder / VS Code / クリップボードから選ぶ。g で git リポジトリのルートに切替。
# どのディレクトリかは foreground_cwd → cwd の順で決まるので、Agent が別の場所で
# 起動されていても画面に映っているほうを指す。
key = "prefix+d"
type = "popup"
command = "exec \"$HOME/src/herdr-plugins/herdr-open/target/release/herdr-open\" ui"
description = "Pane の作業ディレクトリを開く"
width = "50%"
height = "40%"

[[keys.command]]

# 選ばずに一発でエディタへ。popup を出さないので type は shell（detach 実行）。
# どの Pane で押したかは Herdr が渡す HERDR_ACTIVE_PANE_ID から解決される。
key = "prefix+i"
type = "shell"
command = "exec \"$HOME/src/herdr-plugins/herdr-open/target/release/herdr-open\" open editor --git-root"
description = "リポジトリを VS Code で開く"

# ==============================================================================
# Git worktree
# ==============================================================================

[worktrees]

directory = "~/.herdr/worktrees"

# ==============================================================================
# UI
# ==============================================================================

[ui]

# 新規Tab/Workspace作成時に名前入力フォームを出さない。名前は後からrename_tabで変更する。
prompt_new_tab_name = false
prompt_new_workspace_name = false

# 対応が必要なAgentを上に並べ、Pane境界にもAgent名を表示する。
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
sidebar_width = 30
copy_on_select = true

[ui.sidebar.spaces]

# 1行目に手がかり（番号・状態・ディレクトリ・branch・git）、
# 2行目は Workspace 名。名前は長いので1行まるごと使う。
#
# 組み込みトークンは state_icon / state_text / workspace / branch / git_status
# だけなので、$num / $dir / $git は workspace metadata として外から流し込む。
# 更新するのは herdr/bin/herdr-sidebar-meta
# （LaunchAgent dev.herdr.sidebar-meta として常駐）。
#
#   $num      Workspace 番号。prefix+shift+1..9 のどれで飛べるかがそのまま出る。
#   $dir      作業ディレクトリ名（末尾のみ）
#   $git      未コミットの数と upstream との差（●3 ↑2↓1）
#   $elapsed  いまの状態が続いている時間。止まっている Agent に気付くため。
#   $agents   そこで動いている Agent。priority 並びだと Agent パネル側は
#             Workspace が混ざるので、こちらにも顔ぶれを出しておく。
#
# 色は Catppuccin Mocha。dim は既定より暗くて読めないので使わない。
#   #89b4fa blue     $num（番号は目印なので少し目立たせる）
#   #a6adc8 subtext0 $dir
#   #f9e2af yellow   $git（放置している変更に気付けるように）
#   #cdd6f4 text     workspace（名前が一番の手がかり）
#   #6c7086 overlay0 3行目（状態の補足なので一番弱く）
rows = [
  [
    { token = "$num", fg = "#89b4fa" },
    "state_icon",
    { token = "$dir", fg = "#a6adc8" },
    "branch",
    { token = "$git", fg = "#f9e2af" },
    "git_status",
  ],
  [{ token = "workspace", fg = "#cdd6f4", dim = false }],
  [
    { token = "state_text", fg = "#6c7086", dim = false },
    { token = "$elapsed", fg = "#6c7086" },
    { token = "$agents", fg = "#6c7086" },
  ],
]

[ui.sidebar.agents]

# Agent名と状態 / タイトル / いま走っているツール / モデル / 居場所。
# 横に長いものは1行ずつ使う。項目が増えたので row_gap で Agent 同士を離す。
#
# $summary $model $task は pane metadata として外から流し込む値。
#   Claude  hooks から herdr/bin/herdr-agent-meta が報告
#   Codex   herdr/bin/herdr-sidebar-meta が ~/.codex/sessions のログから拾う
#
# pane は名前を付けていない限り空、tab は "Active Agents" のような自動名で
# 手がかりにならないので出さない。priority 並びだと Workspace が混ざるため、
# 居場所としては workspace のほうを出す。
#
# 色は spaces と同じ Catppuccin Mocha。
#   #cdd6f4 text     タイトル（既定では暗くて読めない）
#   #89b4fa blue     $summary（いま動いているもの）
#   #a6adc8 subtext0 $model / workspace
row_gap = 1

rows = [
  ["state_icon", "agent", "state_text", { token = "$elapsed", fg = "#6c7086" }],
  [{ token = "terminal_title_stripped", fg = "#cdd6f4", dim = false }],
  [{ token = "$summary", fg = "#89b4fa" }],
  [{ token = "$model", fg = "#a6adc8" }],
  [{ token = "workspace", fg = "#a6adc8", dim = false }],
]

# Codex はターミナルタイトルに作業ディレクトリ名しか出さないので、
# タイトル行だけ $task（そのセッションの最初の指示）に差し替える。
# 残りの行は Claude と同じ並びにして、見比べられるようにしておく。

[ui.sidebar.agents.rows_by_agent]

codex = [
  ["state_icon", "agent", "state_text", { token = "$elapsed", fg = "#6c7086" }],
  [{ token = "$task", fg = "#cdd6f4", dim = false }],
  [{ token = "$summary", fg = "#89b4fa" }],
  [{ token = "$model", fg = "#a6adc8" }],
  [{ token = "workspace", fg = "#a6adc8", dim = false }],
]

# ==============================================================================
# Notifications
# ==============================================================================

[ui.toast]

# Ghosttyへデスクトップ通知を依頼する。
delivery = "terminal"
delay_seconds = 2

[ui.sound]

enabled = false

# ==============================================================================
# Session
# ==============================================================================

[session]

resume_agents_on_restore = true

# ==============================================================================
# Japanese IME
# ==============================================================================

[experimental]

# Claude/Codex TUIでmacOSの日本語IME候補位置を追従させる。
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]

# prefix中だけASCII入力に切り替え、抜けたら元に戻す。
# 日本語入力のままCtrl-bを押すとPrefix後のキーが入力に食われて失敗するため。
#
# 以前はGoogle日本語入力が英数から戻らないので無効化していたが、
# 現在の入力ソースはABCとことえり(Kotoeri.RomajiTyping)だけで、
# ことえりへの復帰はHerdrが公式に対応している経路。
# 確認: defaults read com.apple.HIToolbox AppleEnabledInputSources
switch_ascii_input_source_in_prefix = true
